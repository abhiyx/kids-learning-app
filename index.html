    <link rel="canonical" href="https://abhiyx.github.io/kids-learning-app/">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Kids Learning App",
      "description": "Interactive math learning app for kids with exercises on missing numbers, addition, subtraction, greater than, smaller than, before and after concepts.",
      "url": "https://abhiyx.github.io/kids-learning-app/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      },
      "educationalUse": "practice",
      "learningResourceType": "interactive",
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student",
        "audienceType": "children"
      }
    }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <main class="menu-container" role="main">
        <header>
            <h1 class="menu-title">🌟 Learning Fun! 🌟</h1>
            <p class="menu-subtitle">Choose an exercise to start learning</p>
        </header>
        
        <div class="exercise-grid">
            <article class="exercise-card" onclick="navigateToExercise('missing')" role="button" tabindex="0" aria-label="Practice missing number exercises">
                <div class="exercise-icon" aria-hidden="true">🔢</div>
                <div class="exercise-name">Missing Number</div>
            </article>
            
            <article class="exercise-card" onclick="navigateToExercise('before')" role="button" tabindex="0" aria-label="Practice before number exercises">
                <div class="exercise-icon" aria-hidden="true">⬅️</div>
                <div class="exercise-name">Before</div>
            </article>
            
            <article class="exercise-card" onclick="navigateToExercise('after')" role="button" tabindex="0" aria-label="Practice after number exercises">
                <div class="exercise-icon" aria-hidden="true">➡️</div>
                <div class="exercise-name">After</div>
            </article>
            
            <article class="exercise-card" onclick="navigateToExercise('greater')" role="button" tabindex="0" aria-label="Practice greater than exercises">
                <div class="exercise-icon" aria-hidden="true">⬆️</div>
                <div class="exercise-name">Greater</div>
            </article>
            
            <article class="exercise-card" onclick="navigateToExercise('smaller')" role="button" tabindex="0" aria-label="Practice smaller than exercises">
                <div class="exercise-icon" aria-hidden="true">⬇️</div>
                <div class="exercise-name">Smaller</div>
            </article>
            
            <article class="exercise-card" onclick="navigateToExercise('addition')" role="button" tabindex="0" aria-label="Practice addition exercises">
                <div class="exercise-icon" aria-hidden="true">➕</div>
                <div class="exercise-name">Addition</div>
            </article>
            
            <article class="exercise-card" onclick="navigateToExercise('subtraction')" role="button" tabindex="0" aria-label="Practice subtraction exercises">
                <div class="exercise-icon" aria-hidden="true">➖</div>
                <div class="exercise-name">Subtraction</div>
            </article>
        </div>
        
        <div class="download-worksheet-card" onclick="openWorksheetModal()" role="button" tabindex="0" aria-label="Download printable worksheet">
            <div class="exercise-icon" aria-hidden="true">📄</div>
            <div class="exercise-name">Download Worksheet</div>
        </div>
    </main>
    
    <!-- Worksheet Modal -->
    <div id="worksheetModal" class="modal-overlay">
        <div class="modal-container">
            <h2 class="modal-title">Create Your Worksheet</h2>
            <form id="worksheetForm">
                <div class="exercise-types-section">
                    <label class="section-label">Select Exercise Type:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="radio" name="exerciseType" value="missing" class="exercise-checkbox">
                            <span>🔢 Missing Number</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="exerciseType" value="before" class="exercise-checkbox">
                            <span>⬅️ Before</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="exerciseType" value="after" class="exercise-checkbox">
                            <span>➡️ After</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="exerciseType" value="greater" class="exercise-checkbox">
                            <span>⬆️ Greater</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="exerciseType" value="smaller" class="exercise-checkbox">
                            <span>⬇️ Smaller</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="exerciseType" value="addition" class="exercise-checkbox">
                            <span>➕ Addition</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="exerciseType" value="subtraction" class="exercise-checkbox">
                            <span>➖ Subtraction</span>
                        </label>
                    </div>
                </div>
                
                <div class="question-count-section">
                    <label for="questionCount" class="section-label">Number of Questions:</label>
                    <input type="number" id="questionCount" name="questionCount" min="5" max="20" value="10" class="number-input">
                    <span class="input-hint">(5-20 questions)</span>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" onclick="closeWorksheetModal()" class="modal-button cancel-button">Cancel</button>
                    <button type="submit" class="modal-button generate-button">Generate Worksheet</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="logic.js"></script>
    <script src="worksheet.js"></script>
    <script src="router.js"></script>
    <script type="module" src="analytics.js"></script>
    <script>
        // Initialize analytics when page loads
        window.addEventListener('DOMContentLoaded', async () => {
            // Wait for analytics module to load if needed
            if (typeof initAnalytics === 'function') {
                await initAnalytics();
                trackPageView('Menu');
            } else {
                // Retry after a short delay if module hasn't loaded yet
                setTimeout(async () => {
                    if (typeof initAnalytics === 'function') {
                        await initAnalytics();
                        trackPageView('Menu');
                    }
                }, 100);
            }
        });
        
        // Modal functions
        function openWorksheetModal() {
            const modal = document.getElementById('worksheetModal');
            modal.classList.add('active');
        }
        
        function closeWorksheetModal() {
            const modal = document.getElementById('worksheetModal');
            modal.classList.remove('active');
            // Reset form
            document.getElementById('worksheetForm').reset();
        }
        
        // Close modal when clicking outside
        document.getElementById('worksheetModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeWorksheetModal();
            }
        });
        
        // Handle form submission
        document.getElementById('worksheetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get selected exercise type
            const selectedRadio = document.querySelector('input[name="exerciseType"]:checked');
            
            // Get question count
            const questionCountInput = document.getElementById('questionCount');
            const questionCount = parseInt(questionCountInput.value);
            
            // Validation
            if (!selectedRadio) {
                alert('Please select an exercise type.');
                return;
            }
            
            const selectedType = selectedRadio.value;
            const selectedTypes = [selectedType];
            
            if (isNaN(questionCount) || questionCount < 5 || questionCount > 20) {
                alert('Please enter a number between 5 and 20 for the question count.');
                questionCountInput.focus();
                return;
            }
            
            try {
                // Generate worksheet
                const worksheetData = generateWorksheet(selectedTypes, questionCount);
                
                // Track worksheet download
                trackWorksheetDownload(selectedType, questionCount);
                
                // Create and download PDF (worksheetData already contains exerciseTypes)
                createPDF(worksheetData);
                
                // Close modal
                closeWorksheetModal();
            } catch (error) {
                alert('Error generating worksheet: ' + error.message);
            }
        });
    </script>
</body>
</html>
